<!DOCTYPE html>
<html>
<head>
    <title>Learning GPS</title>
</head>

<body>
    <h1>Learning GPS!</h1>

    <form method="POST" action="/analyze">
    
        <h2>Where do you want to go?</h2>
        <input
            type="radio"
            id="ai_engineer"
            name="goal"
            value="AI Engineer"
            required
        >
        <label for="ai_engineer">
            🤖 AI Engineer
        </label>
        <br><br>

        <input
            type="radio"
            id="cybersecurity"
            name="goal"
            value="Cybersecurity"
            required
        >
        <label for="cybersecurity">
            🔐 Cybersecurity
        </label>
        <br><br>

        <input
            type="radio"
            id="backend"
            name="goal"
            value="Backend Developer"
            required
        >
        <label for="backend">
            ⚙️ Backend Developer
        </label>
        <br><br>

        <input
            type="radio"
            id="data_analyst"
            name="goal"
            value="Data Analyst"
            required
        >
        <label for="data_analyst">
            📊 Data Analyst
        </label>
        <br><br>

        <input
            type="radio"
            id="custom"
            name="goal"
            value="Custom Path"
            required
        >
        <label for="custom">
            ✨ Create My Own Path
        </label>
        
        <hr>

        <h2>Where are you now?</h2>
    
        <p>
            Check the skills you have already learned:
        </p>

       {% for stage in learning_map["stages"] %}
            {% if stage["skills"] %}
                <h3>{{ stage["name"] }}</h3>
                {% for skill in stage["skills"] %}
                    <div>
                        <input type="checkbox" id="{{ skill }}" name="learned_skills" value="{{ skill }}">
                        <label for="{{ skill }}">{{ skill }}</label>
                    </div>
                {% endfor %}
            {% endif %}
        {% endfor %}     

        <br><br>

        <button type="submit">
            Analyze My Path
        </button>
    </form>
</body>
</html>
